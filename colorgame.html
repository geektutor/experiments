<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevFest Stroop Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117; --text: #c9d1d9; 
            --green: #3fb950; --red: #f85149; --blue: #58a6ff;
            --border: #30363d;
        }
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg); color: var(--text);
            text-align: center; margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow-x: hidden; padding: 15px; box-sizing: border-box;
        }
        .screen { display: none; width: 100%; max-width: 420px; }
        .active { display: flex; flex-direction: column; align-items: center; }
        
        h1 { color: var(--blue); margin-bottom: 5px; font-size: 1.6rem; }
        p { font-size: 0.85rem; color: #8b949e; margin-bottom: 20px; line-height: 1.4; }

        input {
            background: #010409; border: 1px solid var(--border);
            color: var(--green); padding: 15px; font-family: inherit;
            font-size: 1.1rem; width: 85%; text-align: center;
            border-radius: 6px; margin-bottom: 20px; outline: none;
        }

        .btn {
            padding: 15px 30px; font-family: inherit; font-size: 1.1rem;
            font-weight: bold; border: none; border-radius: 6px;
            cursor: pointer; width: 85%; text-transform: uppercase;
            transition: 0.1s;
        }
        .btn-primary { background: var(--green); color: #fff; }
        .btn:active { opacity: 0.8; transform: scale(0.98); }

        /* HUD & Timer bar */
        .hud {
            width: 100%; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px; font-size: 0.9rem;
            font-weight: bold;
        }
        .timer-container {
            width: 100%; height: 8px; background: #21262d;
            border-radius: 4px; overflow: hidden; margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .timer-bar {
            width: 100%; height: 100%; background: var(--blue);
            transition: width 0.1s linear;
        }

        /* Instruction Banner */
        .instruction-box {
            background: #161b22; border: 1px solid var(--border);
            padding: 12px; border-radius: 6px; margin-bottom: 20px;
            width: 100%; box-sizing: border-box; font-size: 0.9rem;
            color: #58a6ff; font-weight: bold;
        }

        /* 4 Frames Grid */
        .grid-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            width: 100%; margin-bottom: 20px;
        }
        .card {
            aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            user-select: none; transition: transform 0.1s, border-color 0.1s;
            box-sizing: border-box; padding: 10px; text-align: center;
            word-break: break-word;
        }
        .card:active { transform: scale(0.95); }

        /* Leaderboard */
        .leaderboard-box {
            background: #161b22; border: 1px solid var(--border);
            width: 100%; border-radius: 6px; padding: 10px;
            margin-bottom: 20px; box-sizing: border-box;
        }
        li {
            display: flex; justify-content: space-between;
            padding: 8px; border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        li:last-child { border-bottom: none; }
        li span:first-child { color: var(--blue); }
        li strong { color: var(--green); }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login" class="screen active">
        <h1>&lt;Stroop_Challenge /&gt;</h1>
        <p>Match colors & text under pressure.<br>You have 5s per round. Don't get tricked!</p>
        
        <input type="text" id="username" placeholder="git config user.name" maxlength="12">
        <button class="btn btn-primary" onclick="startGame()">INIT_GAME()</button>
    </div>

    <!-- SCREEN 2: GAME -->
    <div id="screen-game" class="screen">
        <div class="hud">
            <span>SCORE: <strong id="current-score" style="color:var(--green)">0</strong></span>
            <span>STREAK: <strong id="current-streak" style="color:var(--blue)">0</strong></span>
        </div>
        
        <div class="timer-container">
            <div id="timerBar" class="timer-bar"></div>
        </div>

        <div id="instruction" class="instruction-box">Find Background: RED</div>
        
        <div class="grid-container">
            <div class="card" id="card-0" onclick="handleCardClick(0)"></div>
            <div class="card" id="card-1" onclick="handleCardClick(1)"></div>
            <div class="card" id="card-2" onclick="handleCardClick(2)"></div>
            <div class="card" id="card-3" onclick="handleCardClick(3)"></div>
        </div>
    </div>

    <!-- SCREEN 3: RESULT / LEADERBOARD -->
    <div id="screen-result" class="screen">
        <h1 id="result-title">KERNEL PANIC</h1>
        <p>Final Score: <span id="final-score" style="color:var(--green); font-size:1.2rem; font-weight:bold;">0</span></p>

        <div class="leaderboard-box">
            <div style="padding:5px; border-bottom:1px solid var(--border); color:#8b949e">TOP CONTRIBUTORS</div>
            <ul id="leaderboard-list" style="list-style:none; padding:0; margin:0;">
                <li style="justify-content:center;">Loading data...</li>
            </ul>
        </div>

        <button class="btn btn-primary" onclick="resetGame()">git reset --hard</button>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_P4OiMCI9bf3d3ET7-ZM47DWCVNvtEHS4fBviRpJ_fbx16RfchtrDUJ4wNQbrxqM4/exec'; // Your Google Script URL

        let name = "";
        let score = 0;
        let streak = 0;
        let roundTime = 5000; // 5 seconds per round
        let timerInterval = null;
        let startTime = null;
        let correctCardIndex = -1;

        const COLORS = [
            { name: 'RED', hex: '#f85149', cssName: 'red' },
            { name: 'BLUE', hex: '#58a6ff', cssName: 'blue' },
            { name: 'GREEN', hex: '#3fb950', cssName: 'green' },
            { name: 'YELLOW', hex: '#d29922', cssName: 'yellow' }
        ];

        function startGame() {
            name = document.getElementById('username').value.trim();
            if (!name) return alert("Identify yourself, dev.");
            score = 0;
            streak = 0;
            switchScreen('screen-game');
            nextRound();
        }

        function nextRound() {
            document.getElementById('current-score').innerText = score;
            document.getElementById('current-streak').innerText = streak;

            // Pick a rule type: 0 = Match Background color, 1 = Match Text color, 2 = Match Text meaning word
            const ruleType = Math.floor(Math.random() * 3);
            
            // Pick target color object
            const targetColor = COLORS[Math.floor(Math.random() * COLORS.length)];
            
            if (ruleType === 0) {
                document.getElementById('instruction').innerText = `CLICK FRAME WITH BACKGROUND: ${targetColor.name}`;
            } else if (ruleType === 1) {
                document.getElementById('instruction').innerText = `CLICK FRAME WITH TEXT COLOR: ${targetColor.name}`;
            } else {
                document.getElementById('instruction').innerText = `CLICK FRAME WITH WORD: ${targetColor.name}`;
            }

            // Generate properties for 4 cards ensuring one is correct and others are distractors
            correctCardIndex = Math.floor(Math.random() * 4);
            let cardData = [];

            for (let i = 0; i < 4; i++) {
                if (i === correctCardIndex) {
                    // This card satisfies the rule
                    if (ruleType === 0) {
                        cardData.push({
                            bg: targetColor.hex,
                            text: COLORS[Math.floor(Math.random() * COLORS.length)].name,
                            textColor: COLORS[Math.floor(Math.random() * COLORS.length)].hex
                        });
                    } else if (ruleType === 1) {
                        cardData.push({
                            bg: COLORS[Math.floor(Math.random() * COLORS.length)].hex,
                            text: COLORS[Math.floor(Math.random() * COLORS.length)].name,
                            textColor: targetColor.hex
                        });
                    } else {
                        cardData.push({
                            bg: COLORS[Math.floor(Math.random() * COLORS.length)].hex,
                            text: targetColor.name,
                            textColor: COLORS[Math.floor(Math.random() * COLORS.length)].hex
                        });
                    }
                } else {
                    // Distractor card (ensure it doesn't accidentally meet the rule)
                    let dBg, dText, dTextCol;
                    do {
                        dBg = COLORS[Math.floor(Math.random() * COLORS.length)].hex;
                        dText = COLORS[Math.floor(Math.random() * COLORS.length)].name;
                        dTextCol = COLORS[Math.floor(Math.random() * COLORS.length)].hex;
                    } while (
                        (ruleType === 0 && dBg === targetColor.hex) ||
                        (ruleType === 1 && dTextCol === targetColor.hex) ||
                        (ruleType === 2 && dText === targetColor.name)
                    );
                    cardData.push({ bg: dBg, text: dText, textColor: dTextCol });
                }
            }

            // Render cards to UI
            for (let i = 0; i < 4; i++) {
                const cardEl = document.getElementById(`card-${i}`);
                cardEl.style.backgroundColor = cardData[i].bg;
                cardEl.style.color = cardData[i].textColor;
                cardEl.innerText = cardData[i].text;
            }

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            startTime = Date.now();
            const bar = document.getElementById('timerBar');
            bar.style.width = '100%';

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = roundTime - elapsed;
                const pct = Math.max(0, (remaining / roundTime) * 100);
                bar.style.width = pct + '%';

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    gameOver();
                }
            }, 50);
        }

        function handleCardClick(index) {
            clearInterval(timerInterval);
            if (index === correctCardIndex) {
                score += 100 + (streak * 10);
                streak++;
                // Slight speedup bonus every 5 streaks to increase difficulty
                if (roundTime > 2500) roundTime -= 150; 
                nextRound();
            } else {
                gameOver();
            }
        }

        function gameOver() {
            clearInterval(timerInterval);
            switchScreen('screen-result');
            document.getElementById('final-score').innerText = score;

            const title = document.getElementById('result-title');
            if (score > 1500) title.innerText = "AI OVERLORD";
            else if (score > 800) title.innerText = "STAFF ENGINEER";
            else if (score > 300) title.innerText = "JUNIOR DEV";
            else title.innerText = "INTERN BUG";

            saveScore(score);
        }

        function saveScore(finalScore) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ name: name, stoppedAt: finalScore, diff: "Score" })
            })
            .then(() => fetchLeaderboard())
            .catch(err => console.error(err));
        }

        function fetchLeaderboard() {
            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('leaderboard-list');
                let html = '';
                // Sort descending by score if your backend returns raw entries
                data.sort((a, b) => b.stoppedAt - a.stoppedAt);
                data.slice(0, 5).forEach(p => {
                    html += `<li><span>${escapeHtml(p.name)}</span> <strong>${p.stoppedAt} pts</strong></li>`;
                });
                list.innerHTML = html;
            }).catch(() => {
                document.getElementById('leaderboard-list').innerHTML = `<li style="justify-content:center;">Score saved locally!</li>`;
            });
        }

        function resetGame() {
            roundTime = 5000;
            switchScreen('screen-login');
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
